name: Bug report
description: Report a reproducible problem without sharing secrets.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove tokens, chat IDs, cookies, local paths, and personal data before submitting.
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
  - type: input
    id: uv
    attributes:
      label: uv version
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Redact paths and credentials.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include redacted logs only.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
  - type: checkboxes
    id: access
    attributes:
      label: Access and secrets
      options:
        - label: I removed secrets and personal data.
          required: true
        - label: I noted whether 403 or CAPTCHA occurred.
          required: true
