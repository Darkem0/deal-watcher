[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deal-watcher"
version = "0.1.0"
description = "Windows-local deal monitoring and notification system"
requires-python = ">=3.12"
dependencies = ["beautifulsoup4>=4.12", "httpx>=0.27", "pydantic-settings>=2.0", "PyYAML>=6.0", "selectolax>=0.3", "tzdata>=2025.2"]

[project.scripts]
deal-watcher = "deal_watcher.cli:main"

[project.optional-dependencies]
experimental = ["playwright>=1.45"]
notifications = ["winotify>=1.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=deal_watcher --cov-report=term-missing"

[tool.coverage.run]
branch = true

[tool.coverage.report]
skip_covered = false
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100
