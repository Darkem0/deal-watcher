[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deal-watcher"
version = "0.3.0"
description = "Local-first forum deal monitoring and Telegram notification tool"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Emre Aslan" }]
keywords = [
  "deal-monitor",
  "telegram-bot",
  "forum-monitor",
  "notifications",
  "automation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Utilities",
]
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "pydantic-settings>=2.0",
  "PyYAML>=6.0",
  "selectolax>=0.3",
  "tzdata>=2025.2",
]

[project.urls]
Homepage = "https://github.com/Darkem0/deal-watcher"
Documentation = "https://github.com/Darkem0/deal-watcher#readme"
Issues = "https://github.com/Darkem0/deal-watcher/issues"
Repository = "https://github.com/Darkem0/deal-watcher.git"

[project.scripts]
deal-watcher = "deal_watcher.cli:main"
deal-watcher-setup = "deal_watcher.setup:main"

[project.optional-dependencies]
experimental = ["playwright>=1.45"]
notifications = ["winotify>=1.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=deal_watcher --cov-report=term-missing"

[tool.coverage.run]
branch = true

[tool.coverage.report]
skip_covered = false
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100
